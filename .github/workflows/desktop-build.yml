name: desktop-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Node and Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Run checks
        working-directory: desktop
        run: npm run check

  package:
    name: Package ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows portable
            os: windows-latest
            script: pack:win
            artifact: windows-portable
          - name: macOS DMG and ZIP
            os: macos-latest
            script: pack:mac
            artifact: macos
          - name: Linux AppImage and DEB
            os: ubuntu-latest
            script: pack:linux
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Install Linux packager dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2 fakeroot
      - name: Build desktop package
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run ${{ matrix.script }}
      - name: Upload ${{ matrix.name }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Windows, macOS and Linux
    needs: package
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: release-assets
          merge-multiple: false
      - name: Collect installers
        run: |
          mkdir -p out
          find release-assets -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' \) -exec cp -t out {} +
          ls -la out
          test "$(find out -type f | wc -l)" -ge 4
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$'冷咖啡破甲工作台 3.1.0-preview.1\n\n- Windows：免安装 portable exe\n- macOS：dmg 和 zip。第一次若被系统拦住，在图标上右键打开。\n- Linux：AppImage 和 deb\n\nKey 在 https://coldcoffeeai.com/ 购买。打开软件后单独发送「冷咖啡」。'
          if gh release view "v3.1.0-preview.1" >/dev/null 2>&1; then
            gh release upload "v3.1.0-preview.1" out/* --clobber
          else
            gh release create "v3.1.0-preview.1" out/* --title "3.1.0-preview.1" --notes "$notes" --latest
          fi
